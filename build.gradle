plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName = "${project.mod_name}-${project.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
}

sourceSets {
    main {
        java {
            srcDirs(
                "guilib/src/",
                "linkableapi/src/",
                "contentPackLib/src"
            )
        }
    }
}

neoForge {
    version = project.neoforge_version
    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty('forge.logging.console.level', 'debug')
        }

        server {
            server()
            systemProperty('forge.logging.console.level', 'debug')
        }
    }

    mods {
        opensignals {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    archiveFileName = "${project.mod_name}-${project.minecraft_version}-${project.version}.jar"
    manifest {
        attributes([
            "Specification-Title": project.mod_name,
            "Specification-Vendor": "troblecodings",
            "Specification-Version": project.version,
            "Implementation-Title": project.mod_name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "troblecodings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('releaseArtifact') {
    dependsOn tasks.named('jar')

    doLast {
        def jarTask = tasks.named('jar').get()
        def jarFile = jarTask.archiveFile.get().asFile
        def outDir = file("${layout.buildDirectory.getAsFile().get()}/releases")
        outDir.mkdirs()

        copy {
            from jarFile
            into outDir
        }
    }
}
